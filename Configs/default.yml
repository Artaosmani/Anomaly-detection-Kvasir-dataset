# YOLO26 polyp detection on Kvasir-SEG — the single config for src.py and train.py.
# Relative paths are relative to the project root (Anomaly_detection/).
# Any train/augment/output key can be overridden from the CLI:
#   python YOLO/train.py --set lr0=0.005 epochs=50

paths:
  images: Data/Kvasir-SEG/images       # original Kvasir-SEG jpgs (input)
  labels: labels/kavsir_bboxes.json    # bounding boxes per image id (input)
  dataset: Data/yolo                   # YOLO-format dataset built by `python YOLO/src.py` (output)
                                       #   -> Data/yolo/{images,labels}/{train,val,test} + Data/yolo/data.yaml

split:
  seed: 0                              # same seed = same train/val/test split every time
  train: 0.8
  val: 0.1                             # test gets the remainder (0.1)

model: yolo26n.pt                      # yolo26{n,s,m,l,x}.pt (pretrained) or yolo26n.yaml (from scratch)

train:
  epochs: 150
  imgsz: 640
  batch: 16                # -1 = auto batch (CUDA only)
  patience: 30             # early stopping, epochs without val improvement
  device: auto             # auto | cpu | mps | 0 | 0,1
  workers: 8
  seed: 0
  deterministic: true
  cache: ram               # false | ram | disk  (800 images fit easily in RAM)
  amp: true
  pretrained: true
  freeze: null             # e.g. 10 to freeze the first 10 layers
  single_cls: true

  # optimizer + schedule
  optimizer: auto          # auto | SGD | MuSGD | Adam | AdamW | RMSProp
  lr0: 0.01
  lrf: 0.01                # final lr = lr0 * lrf
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true
  close_mosaic: 10         # disable mosaic for the last N epochs

  # loss weights
  box: 7.5
  cls: 0.5
  dfl: 1.5

augment:
  # colour: keep hue shift small, mucosa colour is diagnostic
  hsv_h: 0.01
  hsv_s: 0.5
  hsv_v: 0.3
  # geometry: endoscopy has no canonical orientation
  degrees: 15.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  # composition
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

output:
  project: runs            # runs/<name>/weights/{best,last}.pt
  name: yolo26_kvasir
  exist_ok: false
  save_period: -1          # save a checkpoint every N epochs (-1 = only last/best)
  plots: true
  verbose: true

evaluate:
  split: test              # evaluate best.pt on this split after training (null to skip)
  conf: 0.001
  iou: 0.6

export:
  format: null             # e.g. onnx | coreml | torchscript (null to skip)
